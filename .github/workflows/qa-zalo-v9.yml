name: QA Zalo Button V9

on:
  push:
    branches:
      - fix/zalo-button-v9

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate Zalo contact dock
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'
          python3 scripts/prepare-pages.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/qa-functional.py --site _site
          python3 scripts/qa-visual.py --site _site
          python3 scripts/qa-motion.py --site _site
          node --check _site/assets/js/contact-dock.js
          node --check _site/assets/js/motion-system.js
