name: QA Mobile Nav Isolation
on:
  push:
    branches:
      - fix/mobile-nav-isolation
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate isolated mobile menu
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'
          python3 scripts/prepare-pages.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/qa-functional.py --site _site
          python3 scripts/qa-visual.py --site _site
          python3 scripts/qa-motion.py --site _site
          python3 scripts/qa-colors.py --site _site
          python3 scripts/qa-mobile.py --site _site
          python3 scripts/qa-nav.py --site _site
          node --check _site/assets/js/main.js
          node --check _site/assets/js/home-v2.js
          node --check _site/assets/js/lead-form.js
          node --check _site/assets/js/contact-dock.js
          node --check _site/assets/js/page-transition.js
          node --check _site/assets/js/motion-system.js
          node --check _site/assets/js/full-page-motion.js
