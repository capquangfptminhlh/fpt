name: QA UI Reset
on:
  push:
    branches:
      - redesign/ui-reset-v1
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate reset UI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'
          python3 scripts/prepare-pages.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/qa-functional.py --site _site
          python3 scripts/qa-ui-reset.py --site _site
          node --check _site/assets/js/main.js
          node --check _site/assets/js/home-v2.js
          node --check _site/assets/js/lead-form.js
          node --check _site/assets/js/contact-dock.js
          node --check _site/assets/js/page-transition.js
          node --check _site/assets/js/ui-motion.js
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-reset-preview
          path: _site
