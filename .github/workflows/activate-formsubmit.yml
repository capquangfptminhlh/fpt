name: Test Lead Delivery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/activate-formsubmit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send one-time delivery test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST 'https://email.gosecureserver.in/api/send.php' \
            --data '{"to":"hainambaseus2@gmail.com","subject":"[TEST] Website FPT lead delivery","name":"Website QA","phone":"0900000000","address":"Technical test only - ignore","need":"QA","message":"One-time delivery test. No customer data.","hp_email":""}'
