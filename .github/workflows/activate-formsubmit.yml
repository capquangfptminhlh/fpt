name: Activate FormSubmit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/activate-formsubmit.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger activation email once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST 'https://formsubmit.co/ajax/hainambaseus2@gmail.com' \
            --data '{"name":"Website activation test","phone":"0900000000","address":"Activation only - ignore","need":"Technical activation","note":"One-time technical submission used only to activate the form endpoint.","_subject":"Activate website lead form","_template":"table","_url":"https://capquangfptminhlh.github.io/fpt/lien-he/"}'
