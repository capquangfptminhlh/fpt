name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deployment-status.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/' \
            --exclude='/deployment-status.json'

          test -f _site/assets/css/match-v2.css
          test -f _site/assets/css/site-footer-v2.css
          test -f _site/assets/css/tech-type.css
          test -f _site/assets/js/home-match.js

          pages=(
            index.html
            internet-fpt/index.html
            goi-cuoc-fpt/index.html
            combo-fpt/index.html
            wifi-7/index.html
            camera-fpt/index.html
            fpt-play/index.html
            khu-vuc/index.html
            ho-tro/index.html
          )

          for page in "${pages[@]}"; do
            file="_site/$page"
            test -f "$file"
            sed -E -i \
              -e "s#match-v2\\.css\\?v=[^\"']+#match-v2.css?v=${GITHUB_SHA}#g" \
              -e "s#home-match\\.js\\?v=[^\"']+#home-match.js?v=${GITHUB_SHA}#g" \
              "$file"
          done

          for page in "${pages[@]}"; do
            file="_site/$page"
            grep -q 'fpt-match-v2' "$file"
            grep -q 'data-match-v2-style="true"' "$file"
            grep -q 'data-hm-menu-panel' "$file"
            grep -q 'class="hm-dock"' "$file"
            grep -q "match-v2.css?v=${GITHUB_SHA}" "$file"
            grep -q "home-match.js?v=${GITHUB_SHA}" "$file"
            if grep -Eqi 'core-neo\.css|home-neo\.css|home-tone-white\.css|site-shell\.css|mobile-premium\.css|contact-dock\.js|mobile-v3\.css|neo-core-page|data-core-neo-style=' "$file"; then
              echo "HANDOFF GATE FAIL: legacy visual layer found in $page"
              exit 1
            fi
          done

          grep -q 'hm-hero-grid' _site/index.html
          for page in internet-fpt goi-cuoc-fpt combo-fpt wifi-7 camera-fpt fpt-play khu-vuc ho-tro; do
            grep -q 'm2-core-grid' "_site/$page/index.html"
          done

          grep -q 'data-hm-footer' _site/assets/js/home-match.js
          grep -q 'site-footer-v2.css' _site/assets/js/home-match.js
          grep -q '.hm-footer' _site/assets/css/site-footer-v2.css
          grep -q 'data-tech-type' _site/assets/js/home-match.js
          grep -q 'data-tech-fonts-ready' _site/assets/js/home-match.js
          grep -q 'tech-type.css' _site/assets/js/home-match.js
          grep -q 'Space Grotesk' _site/assets/css/tech-type.css
          grep -q 'Manrope' _site/assets/css/tech-type.css
          node --check _site/assets/js/home-match.js

          printf '{"sha":"%s","run_id":"%s","layout":"match-v2-tech-type-v1"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-version.json
          touch _site/.nojekyll

          echo 'BUILD GATE PASS: match-v2 + footer v2 + Space Grotesk/Manrope tech typography'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages before handoff
        shell: bash
        run: |
          set -euo pipefail
          base='https://capquangfptminhlh.github.io/fpt'
          marker=''

          for attempt in $(seq 1 24); do
            marker="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}/build-version.json?verify=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -q "${GITHUB_SHA}"; then
              echo "Live build marker reached ${GITHUB_SHA} on attempt ${attempt}"
              break
            fi
            echo "Waiting for live Pages propagation (${attempt}/24)..."
            sleep 10
          done

          printf '%s' "$marker" | grep -q "${GITHUB_SHA}" || {
            echo 'LIVE HANDOFF FAIL: production build-version.json is not the current SHA'
            exit 1
          }
          printf '%s' "$marker" | grep -q 'match-v2-tech-type-v1' || {
            echo 'LIVE HANDOFF FAIL: wrong production layout marker'
            exit 1
          }

          paths=(
            '/'
            '/internet-fpt/'
            '/goi-cuoc-fpt/'
            '/combo-fpt/'
            '/wifi-7/'
            '/camera-fpt/'
            '/fpt-play/'
            '/khu-vuc/'
            '/ho-tro/'
          )

          for path in "${paths[@]}"; do
            url="${base}${path}?verify=${GITHUB_SHA}"
            html="$(curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$url")"
            printf '%s' "$html" | grep -q 'fpt-match-v2' || { echo "LIVE HANDOFF FAIL: $path missing fpt-match-v2"; exit 1; }
            printf '%s' "$html" | grep -q 'data-match-v2-style="true"' || { echo "LIVE HANDOFF FAIL: $path missing match-v2 stylesheet marker"; exit 1; }
            printf '%s' "$html" | grep -q "match-v2.css?v=${GITHUB_SHA}" || { echo "LIVE HANDOFF FAIL: $path has stale CSS URL"; exit 1; }
            printf '%s' "$html" | grep -q "home-match.js?v=${GITHUB_SHA}" || { echo "LIVE HANDOFF FAIL: $path has stale JS URL"; exit 1; }
            printf '%s' "$html" | grep -q 'class="hm-dock"' || { echo "LIVE HANDOFF FAIL: $path missing approved contact actions"; exit 1; }
            if printf '%s' "$html" | grep -Eqi 'core-neo\.css|site-shell\.css|mobile-premium\.css|contact-dock\.js|neo-core-page'; then
              echo "LIVE HANDOFF FAIL: $path still exposes legacy UI"
              exit 1
            fi
            echo "LIVE SOURCE PASS $path"
          done

          live_js="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "${base}/assets/js/home-match.js?verify=${GITHUB_SHA}")"
          printf '%s' "$live_js" | grep -q 'data-hm-footer' || { echo 'LIVE HANDOFF FAIL: footer runtime missing'; exit 1; }
          printf '%s' "$live_js" | grep -q 'site-footer-v2.css' || { echo 'LIVE HANDOFF FAIL: footer stylesheet hook missing'; exit 1; }
          printf '%s' "$live_js" | grep -q 'data-tech-type' || { echo 'LIVE HANDOFF FAIL: tech typography runtime marker missing'; exit 1; }
          printf '%s' "$live_js" | grep -q 'data-tech-fonts-ready' || { echo 'LIVE HANDOFF FAIL: tech font readiness marker missing'; exit 1; }
          printf '%s' "$live_js" | grep -q 'tech-type.css' || { echo 'LIVE HANDOFF FAIL: tech typography stylesheet hook missing'; exit 1; }

          live_footer_css="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "${base}/assets/css/site-footer-v2.css?verify=${GITHUB_SHA}")"
          printf '%s' "$live_footer_css" | grep -q '.hm-footer' || { echo 'LIVE HANDOFF FAIL: footer stylesheet missing'; exit 1; }
          live_tech_css="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "${base}/assets/css/tech-type.css?verify=${GITHUB_SHA}")"
          printf '%s' "$live_tech_css" | grep -q 'Space Grotesk' || { echo 'LIVE HANDOFF FAIL: Space Grotesk rule missing'; exit 1; }
          printf '%s' "$live_tech_css" | grep -q 'Manrope' || { echo 'LIVE HANDOFF FAIL: Manrope rule missing'; exit 1; }

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo 'LIVE HANDOFF FAIL: no headless Chrome available for rendered UI QA'; exit 1; }
          for path in "${paths[@]}"; do
            dom="$("$chrome" --headless=new --disable-gpu --no-sandbox --virtual-time-budget=4500 --dump-dom "${base}${path}?renderverify=${GITHUB_SHA}" 2>/dev/null)"
            printf '%s' "$dom" | grep -q 'data-hm-footer="true"' || { echo "LIVE HANDOFF FAIL: rendered footer missing on $path"; exit 1; }
            printf '%s' "$dom" | grep -q 'class="hm-footer"' || { echo "LIVE HANDOFF FAIL: footer DOM class missing on $path"; exit 1; }
            printf '%s' "$dom" | grep -q 'data-tech-type="space-grotesk-manrope-v1"' || { echo "LIVE HANDOFF FAIL: tech type marker missing on $path"; exit 1; }
            printf '%s' "$dom" | grep -q 'data-tech-fonts-ready="true"' || { echo "LIVE HANDOFF FAIL: Space Grotesk/Manrope did not load on $path"; exit 1; }
            echo "LIVE RENDER UI PASS $path"
          done

          echo "LIVE HANDOFF PASS: SHA=${GITHUB_SHA}; 9 primary pages + footer + tech typography verified"

      - name: Record verified deployment
        shell: bash
        run: |
          set -euo pipefail
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"status":"PASS","deployed_sha":"%s","run_id":"%s","verified_at":"%s","layout":"match-v2-tech-type-v1","live_pages":9,"footer":"PASS","font":"PASS","font_stack":"Space Grotesk + Manrope"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$verified_at" > deployment-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status.json
          git commit -m 'chore(deploy): record verified live UI [skip ci]'
          git push
