name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'

          python3 scripts/prepare-pages.py --site _site
          python3 scripts/inject-trust-footer.py --site _site
          python3 scripts/normalize-site-shell.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/remove-legacy-runtime.py --site _site
          python3 scripts/sync-sitemap.py --site _site --origin https://capquangfptminhlh.github.io/fpt

          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path('_site')
          core = [
              'internet-fpt/index.html', 'goi-cuoc-fpt/index.html', 'combo-fpt/index.html',
              'wifi-7/index.html', 'camera-fpt/index.html', 'fpt-play/index.html',
              'khu-vuc/index.html', 'ho-tro/index.html'
          ]
          required_nav = ('Internet','Gói cước','Combo','WiFi 7','Camera','FPT Play','Khu vực','Hỗ trợ')
          errors = []
          pages = list(site.rglob('*.html'))
          if len(pages) < 100:
              errors.append(f'HTML page count too low: {len(pages)}')

          home_path = site / 'index.html'
          homepage = home_path.read_text(encoding='utf-8') if home_path.exists() else ''
          for token in ('fpt-match','data-home-match-style="true"','hm-hero-grid','hm-plan-grid','hm-solution-grid','hm-faq-list','hm-dock'):
              if token not in homepage:
                  errors.append(f'homepage: missing approved layout token {token}')
          if 'home-neo.css' in homepage or 'home-tone-white.css' in homepage:
              errors.append('homepage: legacy Neo homepage styles still loaded')
          if 'data-mobile-premium-style="true"' not in homepage:
              errors.append('homepage: missing premium mobile style')
          if homepage.rfind('data-home-match-style="true"') < homepage.rfind('data-mobile-premium-style="true"'):
              errors.append('homepage: home-match.css must be the final visual stylesheet')

          for rel in core:
              path = site / rel
              if not path.exists():
                  errors.append(f'missing core page {rel}')
                  continue
              html = path.read_text(encoding='utf-8')
              for token in ('neo-core-page','data-core-neo-style=','data-core-neo-hero="true"','data-site-shell-style=','data-mobile-premium-style="true"'):
                  if token not in html:
                      errors.append(f'{rel}: missing {token}')
              if html.rfind('data-mobile-premium-style="true"') < html.rfind('data-site-shell-style="true"'):
                  errors.append(f'{rel}: premium mobile style must load after site shell')
              if html.count('data-core-neo-hero="true"') != 1:
                  errors.append(f'{rel}: core hero must appear exactly once')
              nav = re.search(r'<nav\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>(.*?)</nav>', html, flags=re.I|re.S)
              if not nav:
                  errors.append(f'{rel}: missing nav')
              else:
                  nav_html = nav.group(1)
                  for label in required_nav:
                      if f'>{label}</a>' not in nav_html:
                          errors.append(f'{rel}: missing nav item {label}')
                  if len(re.findall(r'<a\b', nav_html, flags=re.I)) != 8:
                      errors.append(f'{rel}: nav must contain exactly 8 links')
              if 'mobile-v3.css' in html or 'apple-polish.css' in html or 'mobile-nav-final.css' in html:
                  errors.append(f'{rel}: legacy visual layer still loaded')

          for asset in (
              'assets/css/home-match.css','assets/js/home-match.js','assets/css/core-neo.css',
              'assets/css/site-shell.css','assets/css/mobile-premium.css','assets/js/main.js','assets/js/page-transition.js'
          ):
              if not (site / asset).exists():
                  errors.append(f'missing production asset {asset}')

          if errors:
              print('PRODUCTION UI GATE FAIL')
              for error in errors:
                  print('-', error)
              raise SystemExit(1)

          print(f'PRODUCTION UI GATE PASS: html={len(pages)}, homepage=approved-match, core=8')
          PY

          node --check _site/assets/js/main.js
          node --check _site/assets/js/home-match.js
          node --check _site/assets/js/page-transition.js
          node --check _site/assets/js/ui-motion.js
          node --check _site/assets/js/contact-dock.js

          printf '{"sha":"%s","run_id":"%s","layout":"approved-home-match-v1"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-version.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
