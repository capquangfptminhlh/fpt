name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'

          # Handoff pages are deployed byte-for-byte from source. No HTML/CSS rewrite step is allowed here.
          test -f _site/index.html
          test -f _site/wifi-7/index.html
          test -f _site/assets/css/match-v2.css
          test -f _site/assets/js/home-match.js

          grep -q 'fpt-match-v2' _site/index.html
          grep -q 'fpt-match-v2' _site/wifi-7/index.html
          grep -q 'data-match-v2-style="true"' _site/index.html
          grep -q 'data-match-v2-style="true"' _site/wifi-7/index.html
          grep -q 'class="hm-dock"' _site/index.html
          grep -q 'class="hm-dock"' _site/wifi-7/index.html
          grep -q 'm2-core-grid' _site/wifi-7/index.html

          if grep -Eqi 'core-neo\.css|home-neo\.css|home-tone-white\.css|site-shell\.css|mobile-premium\.css|contact-dock\.js|mobile-v3\.css' _site/index.html _site/wifi-7/index.html; then
            echo 'HANDOFF GATE FAIL: legacy visual layer found in approved page'
            exit 1
          fi

          node --check _site/assets/js/home-match.js

          printf '{"sha":"%s","run_id":"%s","layout":"match-v2-direct-source"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-version.json
          touch _site/.nojekyll

          echo 'HANDOFF GATE PASS: direct source artifact; homepage + wifi7 = match-v2'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
