name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'

          python3 scripts/generate-local-keywords.py
          python3 scripts/prepare-pages.py --site _site
          python3 scripts/generate-local-pages.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/qa-functional.py --site _site
          python3 scripts/qa-ui-reset.py --site _site
          python3 scripts/qa-local.py --site _site
          python3 -m py_compile scripts/generate-local-pages.py scripts/generate-local-keywords.py scripts/qa-local.py

          node --check _site/assets/js/main.js
          node --check _site/assets/js/home-v2.js
          node --check _site/assets/js/lead-form.js
          node --check _site/assets/js/contact-dock.js
          node --check _site/assets/js/page-transition.js
          node --check _site/assets/js/ui-motion.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
