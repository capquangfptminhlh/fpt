name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build exact source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'

          test -f _site/assets/css/match-v2.css
          test -f _site/assets/js/home-match.js

          pages=(
            index.html
            internet-fpt/index.html
            goi-cuoc-fpt/index.html
            combo-fpt/index.html
            wifi-7/index.html
            camera-fpt/index.html
            fpt-play/index.html
            khu-vuc/index.html
            ho-tro/index.html
          )

          # Every deploy gets unique visual asset URLs. This prevents browsers/CDNs from
          # reusing an earlier CSS/JS render after a UI change.
          for page in "${pages[@]}"; do
            file="_site/$page"
            test -f "$file"
            sed -E -i \
              -e "s#match-v2\\.css\\?v=[^\"']+#match-v2.css?v=${GITHUB_SHA}#g" \
              -e "s#home-match\\.js\\?v=[^\"']+#home-match.js?v=${GITHUB_SHA}#g" \
              "$file"
          done

          for page in "${pages[@]}"; do
            file="_site/$page"
            grep -q 'fpt-match-v2' "$file"
            grep -q 'data-match-v2-style="true"' "$file"
            grep -q 'data-hm-menu-panel' "$file"
            grep -q 'class="hm-dock"' "$file"
            grep -q "match-v2.css?v=${GITHUB_SHA}" "$file"
            grep -q "home-match.js?v=${GITHUB_SHA}" "$file"
            if grep -Eqi 'core-neo\.css|home-neo\.css|home-tone-white\.css|site-shell\.css|mobile-premium\.css|contact-dock\.js|mobile-v3\.css|neo-core-page|data-core-neo-style=' "$file"; then
              echo "HANDOFF GATE FAIL: legacy visual layer found in $page"
              exit 1
            fi
          done

          grep -q 'hm-hero-grid' _site/index.html
          grep -q 'm2-core-grid' _site/internet-fpt/index.html
          grep -q 'm2-core-grid' _site/goi-cuoc-fpt/index.html
          grep -q 'm2-core-grid' _site/combo-fpt/index.html
          grep -q 'm2-core-grid' _site/wifi-7/index.html
          grep -q 'm2-core-grid' _site/camera-fpt/index.html
          grep -q 'm2-core-grid' _site/fpt-play/index.html
          grep -q 'm2-core-grid' _site/khu-vuc/index.html
          grep -q 'm2-core-grid' _site/ho-tro/index.html

          node --check _site/assets/js/home-match.js

          printf '{"sha":"%s","run_id":"%s","layout":"match-v2-all-primary-pages-cache-busted"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-version.json
          touch _site/.nojekyll

          echo 'HANDOFF GATE PASS: homepage + 8 primary pages use match-v2; zero legacy visual layers; CSS/JS cache-busted by SHA'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
