name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='/server.js' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README.md' \
            --exclude='/QA_REPORT.md' \
            --exclude='/seo/' \
            --exclude='/data/' \
            --exclude='/scripts/'

          python3 scripts/generate-local-keywords.py
          python3 scripts/generate-local-pages.py --site _site
          python3 scripts/enrich-local-silos.py --site _site
          python3 scripts/upgrade-local-catalog.py --site _site
          python3 scripts/expand-local-plan-details.py --site _site
          python3 scripts/add-local-current-offerings.py --site _site
          python3 scripts/fix-local-nav.py --site _site
          python3 scripts/prepare-pages.py --site _site
          python3 scripts/inject-trust-footer.py --site _site
          python3 scripts/inject-contact-dock.py --site _site
          python3 scripts/sync-sitemap.py --site _site --origin https://capquangfptminhlh.github.io/fpt

          # Preserve the previously passing 56-offer layer as a regression gate.
          python3 scripts/qa-local-pages.py --site _site
          python3 scripts/qa-local-silos.py --site _site
          python3 scripts/qa-local-commerce.py --site _site
          python3 scripts/qa-local-commerce-full.py --site _site
          python3 scripts/qa-local-current-offerings.py --site _site
          python3 scripts/qa-local-keywords.py --site _site

          # Expand from the legacy 56 offers to the current official catalog snapshot.
          python3 scripts/complete-official-catalog.py --site _site
          python3 scripts/qa-official-catalog.py --site _site

          # Replace thin province copy with substantial local buying guides.
          python3 scripts/enrich-local-editorial.py --site _site
          python3 scripts/qa-local-editorial.py --site _site

          # Final presentation layer: premium cards + inline details + conversion CTA.
          python3 scripts/premiumize-local-catalog.py --site _site
          python3 scripts/qa-local-catalog-premium.py --site _site
          python3 scripts/qa-search-quality.py --site _site
          python3 scripts/qa-seo-90-day.py --site _site
          python3 scripts/qa-functional.py --site _site
          python3 scripts/qa-ui-reset.py --site _site

          python3 -m py_compile scripts/generate-local-pages.py scripts/enrich-local-silos.py scripts/upgrade-local-catalog.py scripts/expand-local-plan-details.py scripts/add-local-current-offerings.py scripts/complete-official-catalog.py scripts/enrich-local-editorial.py scripts/premiumize-local-catalog.py scripts/inject-trust-footer.py scripts/fix-local-nav.py scripts/generate-local-keywords.py scripts/qa-local-pages.py scripts/qa-local-silos.py scripts/qa-local-commerce.py scripts/qa-local-commerce-full.py scripts/qa-local-current-offerings.py scripts/qa-official-catalog.py scripts/qa-local-editorial.py scripts/qa-local-catalog-premium.py scripts/qa-local-keywords.py scripts/qa-search-quality.py scripts/qa-seo-90-day.py scripts/sync-sitemap.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          html_files = list(Path('_site').rglob('*.html'))
          html_total = len(html_files)
          noindex_re = re.compile(
              r'<meta\b(?=[^>]*\bname=["\']robots["\'])(?=[^>]*\bcontent=["\'][^"\']*\bnoindex\b)[^>]*>',
              flags=re.I,
          )
          noindex_total = sum(
              1 for path in html_files
              if noindex_re.search(path.read_text(encoding='utf-8'))
          )
          indexable_total = html_total - noindex_total
          sitemap = Path('_site/sitemap.xml').read_text(encoding='utf-8')
          sitemap_total = sitemap.count('<url>')
          local_news_noindex = sum(
              1 for path in html_files
              if '/khu-vuc/' in ('/' + path.relative_to('_site').as_posix())
              and '/tin-tuc/index.html' in ('/' + path.relative_to('_site').as_posix())
              and noindex_re.search(path.read_text(encoding='utf-8'))
          )

          print(f'FINAL HTML COUNT: {html_total}')
          print(f'FINAL INDEXABLE HTML COUNT: {indexable_total}')
          print(f'FINAL NOINDEX HTML COUNT: {noindex_total}')
          print(f'FINAL SITEMAP URL COUNT: {sitemap_total}')
          print(f'FINAL LOCAL NEWS NOINDEX COUNT: {local_news_noindex}')

          if html_total < 144:
              raise SystemExit(f'Expected at least 144 HTML pages after trust rollout, got {html_total}')
          if indexable_total < 109:
              raise SystemExit(f'Expected at least 109 indexable HTML pages after trust rollout, got {indexable_total}')
          if sitemap_total != indexable_total:
              raise SystemExit(
                  f'Sitemap/indexability mismatch: sitemap={sitemap_total}, indexable={indexable_total}'
              )
          if local_news_noindex != 34:
              raise SystemExit(f'Expected 34 noindex local news hubs, got {local_news_noindex}')
          if '/fpt/support/' in sitemap:
              raise SystemExit('Legacy noindex /support/ must not be in sitemap')
          PY

          node --check _site/assets/js/main.js
          node --check _site/assets/js/home-v2.js
          node --check _site/assets/js/lead-form.js
          node --check _site/assets/js/contact-dock.js
          node --check _site/assets/js/page-transition.js
          node --check _site/assets/js/ui-motion.js
          node --check _site/assets/js/local-catalog-premium.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
