name: QA Lead Delivery V4

on:
  push:
    branches:
      - test/lead-delivery-v4

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send QA lead
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST 'https://email.gosecureserver.in/api/send.php' \
            --data '{"to":"hainambaseus2@gmail.com","subject":"[QA V4] Website FPT lead delivery","name":"Website QA V4","phone":"0900000000","address":"Technical test only - ignore","need":"QA","message":"One-time end-to-end delivery test after contact button rollout.","hp_email":""}'
